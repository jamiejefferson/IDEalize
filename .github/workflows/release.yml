name: Release

# Pushing a v<version> tag builds the universal macOS DMG and publishes it on a
# GitHub Release. The Windows version ships from the PC team's fork
# (JJ, 6 Nov 2026), so no Windows installer is built here. The
# Release is born a pre-release, so `releases/latest` (the update checker, the
# install script and the website) keeps the previous version until the build
# has been tested: `gh release edit v<version> --prerelease=false --latest`.
# The macOS app is signed with the self-signed certificate in the
# IDEALIZE_MAC_CERT_P12 secret, so folder grants survive an update and the
# updater and install script accept the build. Without the secret the release
# stops: every copy already installed would refuse what it produced.
# The version in the tag must match the manifests.
#
# The job that holds the certificate cannot publish, and the job that publishes
# never sees the certificate, so a compromised publishing action has no way to
# sign a build. Every action is pinned to a commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: The tag names the manifest version
        run: |
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh-plugin-desktop version ${version}" >&2
            exit 1
          fi
      - run: yarn workspace dsh-community-market check
      - name: Signing certificate
        env:
          P12: ${{ secrets.IDEALIZE_MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IDEALIZE_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12}" ]; then echo "::error::No certificate secret, and installed copies refuse an unsigned release."; exit 1; fi
          keychain="${RUNNER_TEMP}/idealize-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "${P12}" | base64 --decode > "${RUNNER_TEMP}/idealize-signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/idealize-signing.p12" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" >/dev/null
          rm "${RUNNER_TEMP}/idealize-signing.p12"
          # codesign finds an identity only on the search list.
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "${keychain}" | awk '/^ *1\)/{print $2}')"
          test -n "${identity}"
          echo "IDEALIZE_MAC_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - run: yarn dist:mac-public
      - name: The shipped app carries the certificate
        run: |
          set -euo pipefail
          app="dsh-plugin-desktop/dist/mac-public/mac-universal/IDEalize V1.app"
          codesign --verify --deep --strict "${app}"
          codesign -d -r- "${app}" 2>&1 | grep -i "= H\"${IDEALIZE_MAC_SIGN_IDENTITY}\""
      - name: Name the assets
        run: |
          set -euo pipefail
          out=dsh-plugin-desktop/dist/mac-public
          dmg="$(ls "$out"/IDEalize-V1-*.dmg | head -1)"
          test -f "$dmg"
          mkdir -p release-assets
          cp "$dmg" release-assets/
          cp "$dmg" release-assets/IDEalize-V1-mac.dmg
          cp install.sh release-assets/install.sh
          (cd release-assets && shasum -a 256 -- * > SHA256SUMS-mac.txt)
      # The same check the updater runs, plus the hardened shape. A proof build
      # (IDEALIZE_PROOF_BUILD) fails here.
      - name: Release check
        run: node dsh-plugin-desktop/scripts/verify-release-shape.ts release-assets/IDEalize-V1-mac.dmg
      - name: Remove the signing certificate before anything leaves this job
        if: always()
        run: |
          keychain="${RUNNER_TEMP}/idealize-signing.keychain-db"
          if [ -f "${keychain}" ]; then security delete-keychain "${keychain}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release-assets
          path: release-assets
      - name: The assets arrived as they were built
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS-mac.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          body: |
            **Installing:** run this once in Terminal, and again any time to update:

            ```
            curl -fsSL https://raw.githubusercontent.com/jamiejefferson/IDEalize/main/install.sh | bash
            ```

            Or download the DMG, drag `IDEalize V1.app` into Applications, then run once so macOS will open it:

            ```
            xattr -dr com.apple.quarantine "/Applications/IDEalize V1.app"
            ```
