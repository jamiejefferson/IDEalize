name: Release

# Pushing a v<version> tag builds the unsigned universal macOS DMG and the
# unsigned Windows x64 NSIS installer and publishes both on one GitHub
# Release, which the app's update checker and the install script both read.
# The version in the tag must match the manifests. Each job uploads its own
# checksum file so neither overwrites the other's.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: The tag names the manifest version
        run: |
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh-plugin-desktop version ${version}" >&2
            exit 1
          fi
      - run: yarn workspace dsh-community-market check
      - run: yarn dist:mac-public
      - name: Name the assets
        run: |
          set -euo pipefail
          out=dsh-plugin-desktop/dist/mac-public
          dmg="$(ls "$out"/IDEalize-V1-*.dmg | head -1)"
          test -f "$dmg"
          mkdir -p release-assets
          cp "$dmg" release-assets/
          cp "$dmg" release-assets/IDEalize-V1-mac.dmg
          cp install.sh release-assets/install.sh
          (cd release-assets && shasum -a 256 -- * > SHA256SUMS-mac.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            **Installing:** run this once in Terminal, and again any time to update:

            ```
            curl -fsSL https://raw.githubusercontent.com/jamiejefferson/IDEalize/main/install.sh | bash
            ```

            Or download the DMG, drag `IDEalize V1.app` into Applications, then run once so macOS will open it:

            ```
            xattr -dr com.apple.quarantine "/Applications/IDEalize V1.app"
            ```

            **Windows:** download `IDEalize-V1-Setup.exe` and run it. The installer is unsigned, so SmartScreen shows "Windows protected your PC": choose **More info**, then **Run anyway**.

  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: The tag names the manifest version
        shell: bash
        run: |
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh-plugin-desktop version ${version}" >&2
            exit 1
          fi
      - run: yarn dist:win
      - name: Name the assets
        shell: bash
        run: |
          set -euo pipefail
          out=dsh-plugin-desktop/dist
          setup="$(ls "$out"/IDEalize-*-x64-Setup.exe | head -1)"
          test -f "$setup"
          mkdir -p release-assets
          cp "$setup" release-assets/
          cp "$setup" release-assets/IDEalize-V1-Setup.exe
          (cd release-assets && sha256sum -- * > SHA256SUMS-windows.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
