name: Release

# Pushing a v<version> tag builds the universal macOS DMG and the unsigned
# Windows x64 NSIS installer and publishes both on one GitHub Release. The
# Release is born a pre-release, so `releases/latest` (the update checker, the
# install script and the website) keeps the previous version until the build
# has been tested: `gh release edit v<version> --prerelease=false --latest`.
# The macOS app is signed with the self-signed certificate in the
# IDEALIZE_MAC_CERT_P12 secret, so folder grants survive an update; without
# the secret it keeps its ad-hoc seal.
# The version in the tag must match the manifests. Each job uploads its own
# checksum file so neither overwrites the other's.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: The tag names the manifest version
        run: |
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh-plugin-desktop version ${version}" >&2
            exit 1
          fi
      - run: yarn workspace dsh-community-market check
      - name: Signing certificate
        env:
          P12: ${{ secrets.IDEALIZE_MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IDEALIZE_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12}" ]; then echo "No certificate secret; the app keeps its ad-hoc seal."; exit 0; fi
          keychain="${RUNNER_TEMP}/idealize-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "${P12}" | base64 --decode > "${RUNNER_TEMP}/idealize-signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/idealize-signing.p12" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" >/dev/null
          rm "${RUNNER_TEMP}/idealize-signing.p12"
          # codesign finds an identity only on the search list.
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "${keychain}" | awk '/^ *1\)/{print $2}')"
          test -n "${identity}"
          echo "IDEALIZE_MAC_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - run: yarn dist:mac-public
      - name: The shipped app carries the certificate
        if: env.IDEALIZE_MAC_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          app="dsh-plugin-desktop/dist/mac-public/mac-universal/IDEalize V1.app"
          codesign --verify --deep --strict "${app}"
          codesign -d -r- "${app}" 2>&1 | grep -i "= H\"${IDEALIZE_MAC_SIGN_IDENTITY}\""
      - name: Name the assets
        run: |
          set -euo pipefail
          out=dsh-plugin-desktop/dist/mac-public
          dmg="$(ls "$out"/IDEalize-V1-*.dmg | head -1)"
          test -f "$dmg"
          mkdir -p release-assets
          cp "$dmg" release-assets/
          cp "$dmg" release-assets/IDEalize-V1-mac.dmg
          cp install.sh release-assets/install.sh
          (cd release-assets && shasum -a 256 -- * > SHA256SUMS-mac.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          body: |
            **Installing:** run this once in Terminal, and again any time to update:

            ```
            curl -fsSL https://raw.githubusercontent.com/jamiejefferson/IDEalize/main/install.sh | bash
            ```

            Or download the DMG, drag `IDEalize V1.app` into Applications, then run once so macOS will open it:

            ```
            xattr -dr com.apple.quarantine "/Applications/IDEalize V1.app"
            ```

            **Windows:** download `IDEalize-V1-Setup.exe` and run it. The installer is unsigned, so SmartScreen shows "Windows protected your PC": choose **More info**, then **Run anyway**.

  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: The tag names the manifest version
        shell: bash
        run: |
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh-plugin-desktop version ${version}" >&2
            exit 1
          fi
      - run: yarn dist:win
      - name: Name the assets
        shell: bash
        run: |
          set -euo pipefail
          out=dsh-plugin-desktop/dist
          setup="$(ls "$out"/IDEalize-*-x64-Setup.exe | head -1)"
          test -f "$setup"
          mkdir -p release-assets
          cp "$setup" release-assets/
          cp "$setup" release-assets/IDEalize-V1-Setup.exe
          (cd release-assets && sha256sum -- * > SHA256SUMS-windows.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: true
