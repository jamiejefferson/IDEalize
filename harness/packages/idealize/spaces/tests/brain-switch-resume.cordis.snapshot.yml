# The same composition, resuming a persisted chat instead of starting one. It
# is what "reconstructable from the log" means here: the switch happened in
# another process whose memory is gone, so the only statement of the brain's
# voice this run can read is the record on disk.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE
    providers:
      - id: brain-replay
        name: Brain replay
        models:
          - id: replay-model
            contextWindow: 128000

# The select route the switch goes over; port 0 takes an OS-assigned port.
- id: web
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: 0

- id: spaces
  name: '@idealize/spaces'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: |
      You are the Coding brain. Answer with code and nothing else.

# Await the persisted resume before the driver looks for a root agent.
- id: resumed-agent
  name: './fixtures/brain-resume-agent.ts'
