# Keyless assembled composition for the brain-instructions snapshot. The
# composition's own persona is the brain the chat STARTS on; `@idealize/spaces`
# contributes the brain the log records once the two differ, which is the case
# the preset lock leaves unserved. No agent-presets roster is composed: this
# scenario pins what the LOG makes the model read, and a roster would put the
# same persona on both sides of the comparison.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE
    providers:
      - id: brain-replay
        name: Brain replay
        models:
          - id: replay-model
            contextWindow: 128000

# The select route the switch goes over; port 0 takes an OS-assigned port.
- id: web
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: 0

- id: spaces
  name: '@idealize/spaces'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: brain-replay
        model: replay-model
        cwd: !!js process.cwd()
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: |
      You are the Coding brain. Answer with code and nothing else.
